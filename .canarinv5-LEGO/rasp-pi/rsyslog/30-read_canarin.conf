# Route read_canarin logs to a dedicated file
module(load="imuxsock")  # usually loaded by default

# Prefer matching by programname (requires handler ident support)
if $programname == "read_canarin" then {
  action(type="omfile" file="/var/log/read_canarin.log" fileCreateMode="0640" fileOwner="root" fileGroup="adm")
  stop
}

# Fallback: match by message prefix if programname is not set properly
if $msg startswith "read_canarin[" then {
  action(type="omfile" file="/var/log/read_canarin.log" fileCreateMode="0640" fileOwner="root" fileGroup="adm")
  stop
}

