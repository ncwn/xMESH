; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

; Build flags for xMESH production firmware
build_flags =
    -D LM_GOD_MODE                ; Enable LoRaMesher callback hooks
    -D HELTEC_WIFI_LORA_32_V3     ; Target hardware platform

; Custom partition table for OTA support (Task 13)
board_build.partitions = partitions.csv

; Library dependencies
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    avaldebe/PMserial@^1.1.1
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    knolleary/PubSubClient@^2.8
    SPI
    file://../../

; Include xmesh-core, xmesh-hal, xmesh-ota from lib directory
lib_extra_dirs = 
    ../../lib

lib_ldf_mode = deep+
build_type = release

[env:ota]
extends = env:heltec_wifi_lora_32_V3
upload_protocol = espota
upload_flags =
    --auth=xmesh2026

; ============================================================
; Native Unit Tests (run on host PC, no hardware required)
; ============================================================
[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=gnu++17
    -DUNIT_TEST
    -DNATIVE_BUILD
    -I../../lib/xmesh-core/include
    -I../../lib/xmesh-security/include
    -I../../lib/xmesh-ota/include
    -Itest/mocks
lib_deps = 
    throwtheswitch/Unity @ ^2.5.2
test_filter = test_native/*
build_src_filter = -<*>
