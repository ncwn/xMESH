; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

; Build flags for xMESH production firmware
build_flags =
    -D LM_GOD_MODE                ; Enable LoRaMesher callback hooks
    -D HELTEC_WIFI_LORA_32_V3     ; Target hardware platform

; Custom partition table for OTA support (Task 13)
board_build.partitions = partitions.csv

; Library dependencies
lib_deps =
    ; LoRaMesher (modified with callbacks) - using local copy in /src
    ; xmesh-core, xmesh-hal, xmesh-ota - using local libraries in /lib

lib_ldf_mode = deep+
build_type = release
